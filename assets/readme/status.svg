<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 236" role="img" aria-labelledby="t d">
  <title id="t">A newer retail game: about 60 percent of the way to playable (estimate)</title>
  <desc id="d">About 4 seconds to its first frame, 30 frames a second in its menus, about 5 frames a second in its 3D world, 100 percent of its shaders translate</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1328"/>
      <stop offset="1" stop-color="#15123a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a48dff"/>
      <stop offset="1" stop-color="#4fe3f2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe3f2"/>
      <stop offset="1" stop-color="#8f78ff"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif }
    .fill { stroke-dasharray: 263.9 439.9 }
  </style>
  <rect x="1" y="1" width="1278" height="234" rx="22" fill="url(#bg)" stroke="#fff" stroke-opacity=".13" stroke-width="2"/>
  <g transform="translate(140 118)" fill="none" stroke-width="18">
    <circle r="70" stroke="#fff" stroke-opacity=".1"/>
    <circle class="fill" r="70" stroke="url(#ring)" stroke-linecap="round" transform="rotate(-90)"/>
  </g>
  <text x="140" y="126" font-size="40" font-weight="800" fill="#f3f6ff" text-anchor="middle">60 %</text>
  <text x="140" y="150" font-size="15" fill="#bcc7ea" text-anchor="middle">estimate</text>
  <text x="262" y="54" font-size="25" font-weight="700" fill="#f3f6ff">A newer retail game, on the way to playable</text>
  <g fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12">
    <rect x="262" y="80" width="232" height="124" rx="16"/>
    <rect x="510" y="80" width="232" height="124" rx="16"/>
    <rect x="758" y="80" width="232" height="124" rx="16"/>
    <rect x="1006" y="80" width="232" height="124" rx="16"/>
  </g>
  <g font-size="40" font-weight="800" text-anchor="middle" fill="url(#ink)">
    <text x="378" y="142">~4 s</text>
    <text x="626" y="142">30 fps</text>
    <text x="874" y="142">~5 fps</text>
    <text x="1122" y="142">100 %</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#c9d3f2">
    <text x="378" y="178">to its first frame</text>
    <text x="626" y="178">in its menus</text>
    <text x="874" y="178">in its 3D world</text>
    <text x="1122" y="178">of its shaders translate</text>
  </g>
</svg>
