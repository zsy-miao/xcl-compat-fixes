name: Windows compatibility preview

on:
  push:
    tags: ['compat-preview-*']
  workflow_dispatch:
    inputs:
      preview_tag:
        description: Existing annotated compatibility-preview tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'Prime1997/xcl-compat-fixes'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - id: tag
        name: Resolve the published tag to its source
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.preview_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_TAG" =~ ^compat-preview-[a-zA-Z0-9.-]+$ ]]
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIEW_TAG")
          test "$(jq -r '.object.type' <<<"$ref")" = tag
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<<"$ref")")
          test "$(jq -r '.object.type' <<<"$tag")" = commit
          echo "revision=$(jq -r '.object.sha' <<<"$tag")" >> "$GITHUB_OUTPUT"
          echo "tag=$PREVIEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          path: source
          persist-credentials: false
      - name: Select the tested toolchain
        shell: pwsh
        working-directory: source
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
      - name: Run Windows checks
        shell: pwsh
        working-directory: source
        run: ./scripts/test.ps1 --skip test_title_runs_and_game_folder_is_untouched
      - name: Build the portable package
        shell: pwsh
        working-directory: source
        run: |
          cargo build --locked --release -p xcl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29.zip'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $archive
          ../scripts/package-preview.ps1 -SourceDirectory . -Executable target/release/xcl.exe -DxcArchive $archive -OutputDirectory target/preview
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            source/target/preview/XCL-Windows-x64.zip
            source/target/preview/XCL-Windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
          path: dist
      - name: Publish the verified archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ needs.resolve.outputs.tag }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c XCL-Windows-x64.zip.sha256)
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIEW_TAG")
          test "$(jq -r '.object.type' <<<"$ref")" = tag
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<<"$ref")")
          test "$(jq -r '.object.sha' <<<"$tag")" = "$REVISION"
          unzip -p dist/XCL-Windows-x64.zip '*/BUILD-INFO.json' | jq -e --arg rev "$REVISION" '.revision == $rev'
          jq -r '.message' <<<"$tag" > "$RUNNER_TEMP/notes.md"
          gh release create "$PREVIEW_TAG" dist/XCL-Windows-x64.zip dist/XCL-Windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Windows compatibility preview $PREVIEW_TAG" --notes-file "$RUNNER_TEMP/notes.md"
