[package]
name = "testgame-mw"
description = "Fake game-shipped middleware DLL used by the XCL test title."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "testgame_mw"
crate-type = ["cdylib"]
path = "src/lib.rs"
# no unit tests: the GNU linker keeps the kernelx.dll import in the test harness's exe,
# which then does not start (kernelx.dll exists only inside XCL)
test = false
